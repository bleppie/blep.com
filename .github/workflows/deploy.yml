# Builds the site and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      # Tells us whether the site is served from a sub-folder
      # (bleppie.github.io/blep.com/) or from a custom domain (www.blep.com).
      - id: pages
        uses: actions/configure-pages@v6
      # Keep generated image sizes between runs so builds stay fast.
      - uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-images-${{ hashFiles('src/content/**') }}
          restore-keys: astro-images-
      - run: npm ci
      - run: npx astro build
        env: { BASE_PATH: '${{ steps.pages.outputs.base_path }}' }
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
